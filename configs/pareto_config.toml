# MadNLP4NN — Constrained Pareto Tracing Case Study Configuration
# Edit before running: julia examples/run_pareto_tracing.jl

[surrogates]
# Paths to trained surrogate checkpoints.
# Leave empty to auto-generate data and train from scratch.
f1_path = ""
f2_path = ""
h_path  = ""      # feasibility surrogate; empty = no learned feasibility

# Surrogate training hyperparameters (only used when paths are empty)
n_dim = 20         # decision variable dimension
n_samples = 5000   # training samples
training_epochs = 200
hidden_dim = 64
n_layers = 3

[problem]
x_lb = -1.0
x_ub = 1.0

[sweep]
# Alpha values for Pareto sweep
n_alpha_coarse = 11    # Stage B coarse sweep
n_alpha_dense  = 21    # Stage C dense sweep
n_starts = 5           # Stage C multi-start runs

[solver]
max_iter = 500
tol = 1e-4
device = "cpu"
linear_solver = "auto"  # "mumps" recommended on CPU, "cudss" on GPU
blas_threads = 4

[output]
results_dir = "output/pareto/results"
