# MadNLP4NN — Darcy Inversion Case Study Configuration
# Edit before running: julia examples/run_darcy_inversion.jl

[fno]
# Path to the trained FNO checkpoint.
# Leave empty ("") to auto-generate data and train from scratch.
checkpoint_path = ""

# FNO training hyperparameters (only used when checkpoint_path is empty)
d_v = 32               # latent channel width
n_layers = 4           # number of Fourier layers
k_max = 16             # number of retained Fourier modes per direction
training_epochs = 200
training_lr = 1e-3
training_batch_size = 32
n_training_samples = 1000

[problem]
grid_n = 64            # grid size (decision dim = grid_n²)
x_lb = 0.0             # lower permeability bound
x_ub = 5.0             # upper permeability bound
lambda_reg = 0.01      # Tikhonov regularization weight

[constraints]
# Set to true to activate each constraint (Stage B/C only)
use_budget = true
use_smoothness = true
# Budget slack relative to the true field's integral
budget_slack = 1.1     # B = budget_slack * sum(x_true)
# Smoothness slack relative to the true field's xᵀLx
smoothness_slack = 1.5 # τ = smoothness_slack * x_true' L x_true

[solver]
max_iter = 500
tol = 1e-4
# Device: "cpu" or "gpu"
device = "cpu"
# Linear solver: "auto", "mumps", "cudss", "lapack_gpu"
# "auto" lets MadNLP pick based on device
linear_solver = "auto"
blas_threads = 4
disable_gc = false

[output]
results_dir = "output/darcy/inversion_results"
save_solution_vector = true
